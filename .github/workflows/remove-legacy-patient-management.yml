name: Retirar gestión local heredada

on:
  push:
    branches: ["agent/remove-legacy-patient-management"]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-patient-management
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Retirar gestión local heredada
        run: node scripts/remove-legacy-patient-management.mjs

      - name: Guardar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-router.js
          git commit -m "Retirar gestión local heredada de pacientes"
          git push origin HEAD:agent/remove-legacy-patient-management
