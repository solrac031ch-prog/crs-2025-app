name: Inspeccionar PDFs rellenables

on:
  push:
    branches: ["agent/fix-production-stability-pdf-v2"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'agent/fix-production-stability-pdf-v2' }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf==1.24.10

      - name: Inspeccionar formularios
        run: python scripts/inspect-pdf-forms.py

      - name: Render diagnóstico
        run: python scripts/render-pdf-form-debug.py

      - name: Subir imágenes diagnósticas
        uses: actions/upload-artifact@v4
        with:
          name: pdf-form-debug
          path: pdf-debug-renders/*.png
          if-no-files-found: error

      - name: Subir PDFs de trabajo
        uses: actions/upload-artifact@v4
        with:
          name: pdf-form-sources
          path: |
            form-docs/examenes-hph.pdf
            form-docs/examenes-hph-rellenable.pdf
            form-docs/transfusion.pdf
            form-docs/transfusion-rellenable.pdf
            form-docs/ley-urgencia-activacion-rellenable.pdf
            form-docs/ley-urgencia-consentimiento-rellenable.pdf
            form-docs/medicamentos-uso-ocasional-rellenable.pdf
          if-no-files-found: error

      - name: Guardar reporte en rama de trabajo
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add pdf-form-layout-report.json pdf-form-layout-report.md
          git diff --cached --quiet || git commit -m "Inspeccionar geometría de PDFs rellenables"
          git push origin HEAD:agent/fix-production-stability-pdf-v2
