name: Navegador CRS HPH

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar Playwright
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Probar navegación real
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-output.log

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostico
          path: |
            playwright-output.log
            test-results/
          if-no-files-found: ignore
          retention-days: 3
