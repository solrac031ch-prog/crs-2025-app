name: Extraer datos de formularios

on:
  push:
    branches: ["agent/extract-forms-data"]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/extract-forms-data
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraer datos de formularios
        run: node scripts/extract-forms-data.mjs

      - name: Guardar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-forms-data.js
          git commit -m "Separar datos de formularios"
          git push origin HEAD:agent/extract-forms-data
