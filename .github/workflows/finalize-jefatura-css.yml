name: Finalizar CSS de Jefatura

on:
  push:
    branches: ["agent/extract-jefatura-css"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/extract-jefatura-css
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalizar frontera
        run: node scripts/finalize-jefatura-css.mjs

      - name: Guardar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ARCHITECTURE.md .github/workflows/validate.yml
          git commit -m "Conectar estilos estáticos de Jefatura"
          git push origin HEAD:agent/extract-jefatura-css
