name: Estabilizar producción CRS

on:
  push:
    branches: ["agent/fix-production-stability-pdf-v2"]

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/fix-production-stability-pdf-v2
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar estabilización
        run: node scripts/stabilize-production.mjs

      - name: Guardar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-router.js gestion-pacientes-core.js index.html
          git commit -m "Estabilizar Gestión y eliminar competencia de rutas"
          git push origin HEAD:agent/fix-production-stability-pdf-v2
