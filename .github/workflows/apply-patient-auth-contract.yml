name: Aplicar contrato seguro Gestión pacientes

on:
  push:
    branches: ["agent/secure-patient-apps-script"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-patient-apps-script
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar contrato
        run: node scripts/patch-patient-auth-contract.mjs
      - name: Limpiar migración temporal y guardar
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/patch-patient-auth-contract.mjs .github/workflows/apply-patient-auth-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion-pacientes-core.js index.html .github/workflows/validate.yml
          git commit -m "Validar Gestión pacientes con sesión Supabase"
          git push origin HEAD:agent/secure-patient-apps-script
