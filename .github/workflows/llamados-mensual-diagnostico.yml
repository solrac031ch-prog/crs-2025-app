name: Diagnóstico rotativa mensual

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  monthly-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Probar validación de rotativa real
        run: npx playwright test tests/e2e/llamados-mensual-guard.spec.js --reporter=line
      - name: Probar rechazo de PDF inválido
        run: npx playwright test tests/e2e/llamados-mensual-upload.spec.js --reporter=line
